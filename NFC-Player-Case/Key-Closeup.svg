<text x="50" y="120.8" font-size="3.5" text-anchor="end" fill="#222826" font-weight="400" style="font-family:system-ui,-apple-system,'Segoe UI',sans-serif">Tactile switch</text>
<line x1="66" y1="132" x2="50.8" y2="131" stroke="#a9b1ad" stroke-width="0.18" />
