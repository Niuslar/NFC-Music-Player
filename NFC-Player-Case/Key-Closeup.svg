<text x="50" y="74.8" font-size="3.5" text-anchor="end" fill="#222826" font-weight="400" style="font-family:system-ui,-apple-system,'Segoe UI',sans-serif">Its lip</text>
<line x1="66" y1="99.8" x2="50.8" y2="98.8" stroke="#a9b1ad" stroke-width="0.18" />
