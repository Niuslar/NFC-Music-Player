<text x="190" y="146.6" font-size="3.5" text-anchor="start" fill="#222826" font-weight="650" style="font-family:system-ui,-apple-system,'Segoe UI',sans-serif">What holds what:</text>
<text x="190" y="151.8" font-size="3.5" text-anchor="start" fill="#222826" font-weight="400" style="font-family:system-ui,-apple-system,'Segoe UI',sans-serif">• The switch clips into the panel.</text>
<text x="190" y="157" font-size="3.5" text-anchor="start" fill="#222826" font-weight="400" style="font-family:system-ui,-apple-system,'Segoe UI',sans-serif">• The board is screwed to the panel.</text>
<text x="190" y="162.2" font-size="3.5" text-anchor="start" fill="#222826" font-weight="400" style="font-family:system-ui,-apple-system,'Segoe UI',sans-serif">• The socket only makes the contact.</text>
<text x="180" y="201" font-size="3" text-anchor="middle" fill="#5f6b66" font-weight="400" style="font-family:system-ui,-apple-system,'Segoe UI',sans-serif">Bought parts at nominal sizes. Cut through the middle of the key; both pins are shown, though one sits 5 mm to the side.</text>
