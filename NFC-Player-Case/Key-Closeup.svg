<text x="70" y="158" font-size="3.5" text-anchor="end" fill="#222826" font-weight="400" style="font-family:system-ui,-apple-system,'Segoe UI',sans-serif">Front board</text>
<line x1="96" y1="165.2" x2="70.8" y2="164.2" stroke="#a9b1ad" stroke-width="0.18" />
<circle cx="96" cy="165.2" r="0.45" fill="#5f6b66" stroke="none" stroke-width="0.3"/>
<text x="70" y="165.2" font-size="3.5" text-anchor="end" fill="#222826" font-weight="400" style="font-family:system-ui,-apple-system,'Segoe UI',sans-serif">Hot-swap socket, soldered on</text>
<text x="8" y="182" font-size="3.5" text-anchor="start" fill="#222826" font-weight="400" style="font-family:system-ui,-apple-system,'Segoe UI',sans-serif">1  Push the switch into the panel from the front until both clips click.</text>
<text x="8" y="187.2" font-size="3.5" text-anchor="start" fill="#222826" font-weight="400" style="font-family:system-ui,-apple-system,'Segoe UI',sans-serif">2  Press the board on from behind: the sockets slide onto the pins.</text>
<text x="8" y="192.4" font-size="3.5" text-anchor="start" fill="#222826" font-weight="400" style="font-family:system-ui,-apple-system,'Segoe UI',sans-serif">3  Push the keycap onto the stem. Fit the board's three M2 screws.</text>
<text x="190" y="8" font-size="4.6" text-anchor="start" fill="#222826" font-weight="650" style="font-family:system-ui,-apple-system,'Segoe UI',sans-serif">Put together</text>
