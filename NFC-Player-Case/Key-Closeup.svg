<text x="290" y="78.8" font-size="3.5" text-anchor="start" fill="#222826" font-weight="400" style="font-family:system-ui,-apple-system,'Segoe UI',sans-serif">Switch inside the cap's hollow</text>
<line x1="262.8" y1="80.8" x2="289.2" y2="83.2" stroke="#a9b1ad" stroke-width="0.18" />
<circle cx="262.8" cy="80.8" r="0.45" fill="#5f6b66" stroke="none" stroke-width="0.3"/>
<text x="290" y="84.2" font-size="3.5" text-anchor="start" fill="#222826" font-weight="400" style="font-family:system-ui,-apple-system,'Segoe UI',sans-serif">Lip against the panel</text>
<line x1="274" y1="81.8" x2="289.2" y2="88.6" stroke="#a9b1ad" stroke-width="0.18" />
<circle cx="274" cy="81.8" r="0.45" fill="#5f6b66" stroke="none" stroke-width="0.3"/>
<text x="290" y="89.6" font-size="3.5" text-anchor="start" fill="#222826" font-weight="400" style="font-family:system-ui,-apple-system,'Segoe UI',sans-serif">Spacer, 2.5 mm</text>
<line x1="274" y1="90" x2="289.2" y2="94" stroke="#a9b1ad" stroke-width="0.18" />
<circle cx="274" cy="90" r="0.45" fill="#5f6b66" stroke="none" stroke-width="0.3"/>
<text x="290" y="95" font-size="3.5" text-anchor="start" fill="#222826" font-weight="400" style="font-family:system-ui,-apple-system,'Segoe UI',sans-serif">Board, held by three M2 screws</text>
<text x="190" y="113.2" font-size="3.5" text-anchor="start" fill="#222826" font-weight="650" style="font-family:system-ui,-apple-system,'Segoe UI',sans-serif">What holds what:</text>
<text x="190" y="118.4" font-size="3.5" text-anchor="start" fill="#222826" font-weight="400" style="font-family:system-ui,-apple-system,'Segoe UI',sans-serif">• The panel guides the cap and stops it at the front.</text>
<text x="190" y="123.6" font-size="3.5" text-anchor="start" fill="#222826" font-weight="400" style="font-family:system-ui,-apple-system,'Segoe UI',sans-serif">• The switch's button pushes it back out.</text>
<text x="190" y="128.8" font-size="3.5" text-anchor="start" fill="#222826" font-weight="400" style="font-family:system-ui,-apple-system,'Segoe UI',sans-serif">• The spacer sets the gap; the board holds the switches.</text>
<text x="180" y="211" font-size="3" text-anchor="middle" fill="#5f6b66" font-weight="400" style="font-family:system-ui,-apple-system,'Segoe UI',sans-serif">Switch at nominal size; check yours. Cut through the middle of the key.</text>
</svg>
