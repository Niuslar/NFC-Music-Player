<text x="50" y="132" font-size="3.5" text-anchor="end" fill="#222826" font-weight="400" style="font-family:system-ui,-apple-system,'Segoe UI',sans-serif">Front board</text>
<line x1="99" y1="137.2" x2="50.8" y2="136.4" stroke="#a9b1ad" stroke-width="0.18" />
<circle cx="99" cy="137.2" r="0.45" fill="#5f6b66" stroke="none" stroke-width="0.3"/>
<text x="50" y="137.4" font-size="3.5" text-anchor="end" fill="#222826" font-weight="400" style="font-family:system-ui,-apple-system,'Segoe UI',sans-serif">Soldered from behind</text>
<text x="8" y="192" font-size="3.5" text-anchor="start" fill="#222826" font-weight="400" style="font-family:system-ui,-apple-system,'Segoe UI',sans-serif">1  With the panel face down, drop each cap into its hole from behind. The lip stops it.</text>
<text x="8" y="197.2" font-size="3.5" text-anchor="start" fill="#222826" font-weight="400" style="font-family:system-ui,-apple-system,'Segoe UI',sans-serif">2  Lay the spacer over the lips, on the back of the panel.</text>
<text x="8" y="202.4" font-size="3.5" text-anchor="start" fill="#222826" font-weight="400" style="font-family:system-ui,-apple-system,'Segoe UI',sans-serif">3  Fit the board, switches towards the panel, with three M2 × 6 screws.</text>
<text x="190" y="8" font-size="4.6" text-anchor="start" fill="#222826" font-weight="650" style="font-family:system-ui,-apple-system,'Segoe UI',sans-serif">Put together</text>
<rect x="190" y="60" width="12.8" height="3.2" rx="0" fill="#d4b06c" stroke="#8a6a2e" stroke-width="0.2" />
<rect x="190" y="63.2" width="13.2" height="13.6" rx="0" fill="#c9ccc8" stroke="#5f6b66" stroke-width="0.2" />
