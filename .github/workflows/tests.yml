name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The same packages as "Try it without any hardware" in the README. No Pi or MPD is needed.
      - run: pip install pillow numpy python-mpd2 pytest qrcode
      - run: python -m pytest
