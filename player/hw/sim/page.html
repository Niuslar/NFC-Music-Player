<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NFC player simulator</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #1b1b1e; color: #e8e6e0; font: 14px/1.4 -apple-system, system-ui, sans-serif;
         display: flex; flex-direction: column; align-items: center; gap: 20px; padding: 28px 16px; }
  .device { background: #2a2a2e; border-radius: 22px; padding: 22px; display: flex; gap: 22px; align-items: center;
            box-shadow: 0 12px 40px #0008, inset 0 1px 0 #fff1; flex-wrap: wrap; justify-content: center; }
  .screen { width: 320px; height: 240px; background: #0e0e10; border-radius: 6px; image-rendering: auto; display: block; }
  .screen.tiny { width: 512px; height: 128px; image-rendering: pixelated; border-radius: 2px; padding: 0; } /* the 128x32 OLED, 4x */
  .controls { display: flex; flex-direction: column; align-items: center; gap: 18px; }
  .knob { width: 96px; height: 96px; border-radius: 50%; border: 0; cursor: grab; position: relative;
          background: radial-gradient(circle at 35% 30%, #d9d9de, #8d8d94 70%); box-shadow: 0 4px 12px #000a; }
  .knob::after { content: ""; position: absolute; left: 50%; top: 8px; width: 3px; height: 14px; margin-left: -1.5px;
                 background: #333; border-radius: 2px; }
  .keys { display: flex; gap: 8px; }
  button.key { width: 46px; height: 46px; border-radius: 9px; border: 0; background: #3c3c42; color: #e8e6e0;
               font-size: 16px; cursor: pointer; box-shadow: 0 2px 0 #0008; }
  button.key.power { color: #e0675d; margin-left: 10px; }
  button.key:active { transform: translateY(2px); box-shadow: none; }
  .panel { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; max-width: 620px; }
  .panel button { padding: 7px 12px; border-radius: 7px; border: 1px solid #444; background: #26262a; color: inherit; cursor: pointer; }
  .panel button.on { border-color: #e8a33d; color: #e8a33d; }
  .label { color: #9a9892; width: 100%; text-align: center; margin-top: 6px; }
  .help { color: #7d7b76; max-width: 620px; text-align: center; }
  kbd { background: #333; border-radius: 4px; padding: 1px 5px; font: inherit; }
</style>
</head>
<body>
<div class="device">
  <img class="screen" id="screen" alt="Player display" width="320" height="240">
  <div class="controls">
    <button class="knob" id="knob" title="Scroll or drag to turn, click to push, hold for long push"></button>
    <div class="keys">
      <button class="key" data-press="prev" title="Previous">⏮</button>
      <button class="key" data-press="play" title="Play / pause">⏯</button>
      <button class="key" data-press="next" title="Next">⏭</button>
      <button class="key" data-press="back" title="Back (hold 2 seconds to restart the album)">↩</button>
      <button class="key power" data-press="power" title="Power: turns the player off, and on again">⏻</button>
    </div>
  </div>
</div>

<div class="panel" id="cards">
  <div class="label">Card slot</div>
  <button data-card="04A1B2C3D4E5F6">Card 1</button>
  <button data-card="04112233445566">Card 2</button>
  <button data-card="04DEADBEEF0001">Card 3</button>
  <button data-card="04CAFE00000002">Card 4</button>
  <button data-card="">Remove card</button>
</div>

<div class="panel">
  <div class="label">USB-C port</div>
  <button data-usb="plug">Plug into Mac</button>
  <button data-usb="eject">Eject on Mac</button>
  <button data-usb="unplug">Unplug</button>
</div>

<p class="help">
  <kbd>←</kbd> <kbd>→</kbd> turn knob (15° each, <kbd>Shift</kbd> for fine) · <kbd>Enter</kbd> push · <kbd>M</kbd> long push ·
  <kbd>Z</kbd> <kbd>X</kbd> <kbd>C</kbd> prev / play / next (hold <kbd>Z</kbd> or <kbd>C</kbd>, or the button, to rewind or fast-forward) · <kbd>Esc</kbd> back (hold 2 s to restart the album) · ⏻ power off and on · <kbd>1</kbd>–<kbd>4</kbd> insert card · <kbd>0</kbd> remove
</p>

<script>
const COUNTS_PER_REV = 256;
const send = (msg) => fetch("/event", { method: "POST", body: JSON.stringify(msg) });
const rotate = (counts) => { if (counts) { send({ type: "rotate", counts }); turnKnob(counts); } };
const press = (button) => send({ type: "press", button });

const screen = document.getElementById("screen");
screen.addEventListener("load", () => screen.classList.toggle("tiny", screen.naturalWidth === 128));
let busy = false;
setInterval(async () => {
  if (busy) return;
  busy = true;
  try {
    const blob = await (await fetch("/frame.png")).blob();
    if (blob.size) { const old = screen.src; screen.src = URL.createObjectURL(blob); if (old) URL.revokeObjectURL(old); }
  } catch (e) {} finally { busy = false; }
}, 120);

const knob = document.getElementById("knob");
let angle = 0;
function turnKnob(counts) { angle += counts * 360 / COUNTS_PER_REV; knob.style.transform = `rotate(${angle}deg)`; }

let wheelAcc = 0;
knob.addEventListener("wheel", (e) => {
  e.preventDefault();
  wheelAcc += -e.deltaY * 0.25;
  const counts = Math.trunc(wheelAcc);
  wheelAcc -= counts;
  rotate(counts);
}, { passive: false });

let drag = null;
knob.addEventListener("pointerdown", (e) => {
  knob.setPointerCapture(e.pointerId);
  drag = { x: e.clientX, moved: 0, at: Date.now(), acc: 0 };
});
knob.addEventListener("pointermove", (e) => {
  if (!drag) return;
  const dx = e.clientX - drag.x;
  drag.x = e.clientX; drag.moved += Math.abs(dx); drag.acc += dx * 0.8;
  const counts = Math.trunc(drag.acc);
  drag.acc -= counts;
  rotate(counts);
});
knob.addEventListener("pointerup", () => {
  if (drag && drag.moved < 4) press(Date.now() - drag.at > 600 ? "knob_long" : "knob");
  drag = null;
});

// Previous and next work like the real buttons: a short press skips, holding scans.
// Back sends back_long once when held for 2 seconds, and back on a shorter press.
const holds = {};
function holdStart(name) {
  if (holds[name]) return;
  if (name === "back") {
    holds[name] = { held: false, timer: setTimeout(() => { holds[name].held = true; press("back_long"); }, 2000) };
    return;
  }
  holds[name] = { held: false, timer: setTimeout(function repeat() {
    holds[name].held = true;
    press(name + "_hold");
    holds[name].timer = setTimeout(repeat, 400);
  }, 400) };
}
function holdEnd(name) {
  const h = holds[name];
  if (!h) return;
  clearTimeout(h.timer);
  if (!h.held) press(name);
  delete holds[name];
}
document.querySelectorAll("[data-press]").forEach((b) => {
  const name = b.dataset.press;
  if (name === "prev" || name === "next" || name === "back") {
    b.addEventListener("pointerdown", () => holdStart(name));
    b.addEventListener("pointerup", () => holdEnd(name));
    b.addEventListener("pointerleave", () => holdEnd(name));
  } else {
    b.addEventListener("click", () => press(name));
  }
});
function setCard(uid) {
  send({ type: "card", uid });
  document.querySelectorAll("[data-card]").forEach((b) => b.classList.toggle("on", !!uid && b.dataset.card === uid));
}
document.querySelectorAll("[data-card]").forEach((b) => b.addEventListener("click", () => setCard(b.dataset.card)));
document.querySelectorAll("[data-usb]").forEach((b) => b.addEventListener("click", () => send({ type: "usb", action: b.dataset.usb })));

const cardUids = [...document.querySelectorAll("[data-card]")].map((b) => b.dataset.card).filter(Boolean);
document.addEventListener("keydown", (e) => {
  const step = e.shiftKey ? 2 : 11;
  const k = e.key.toLowerCase();
  if (k === "arrowright") rotate(step);
  else if (k === "arrowleft") rotate(-step);
  else if (k === "enter" && !e.repeat) press("knob");
  else if (k === "m" && !e.repeat) press("knob_long");
  else if (k === "z") { if (!e.repeat) holdStart("prev"); }
  else if (k === "x" || k === " ") press("play");
  else if (k === "c") { if (!e.repeat) holdStart("next"); }
  else if (k === "escape") { if (!e.repeat) holdStart("back"); }
  else if (k >= "1" && k <= "4") setCard(cardUids[+k - 1]);
  else if (k === "0") setCard("");
  else return;
  e.preventDefault();
});
document.addEventListener("keyup", (e) => {
  const k = e.key.toLowerCase();
  if (k === "z") holdEnd("prev");
  else if (k === "c") holdEnd("next");
  else if (k === "escape") holdEnd("back");
});
</script>
</body>
</html>
